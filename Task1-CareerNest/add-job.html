<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>

        Add Job

    </title>

    <link rel="stylesheet" href="./css/style.css">

</head>

<body>

    <nav>

        <div class="logo">

            💼 CareerNest

        </div>

        <div class="menu">

            <a href="index.html">

                Home

            </a>

            <a href="employer.html">

                Dashboard

            </a>

        </div>

    </nav>

    <div class="form-box">

        <form id="jobForm" class="card">

            <h1>

                Post New Job

            </h1>

            <input id="title" placeholder="Job Title" required>

            <input id="company" placeholder="Company" required>

            <input id="salary" placeholder="Salary" required>

            <input id="location" placeholder="Location" required>

            <label>

                Category

            </label>

            <select id="category" required>

                <option value="">

                    Select Category

                </option>

                <option value="developer">

                    Developer

                </option>

                <option value="data">

                    Data

                </option>

                <option value="design">

                    Design

                </option>

                <option value="internship">

                    Internship

                </option>

            </select>


            <textarea id="description" placeholder="Description">

</textarea>

            <button type="submit">

                Post Job

            </button>

        </form>

    </div>
    
    <footer>

        CareerNest © 2026 | Built by Siddhi Chimurkar

    </footer>

    <script type="module" src="./js/addJob.js">

    </script>

</body>

</html>
