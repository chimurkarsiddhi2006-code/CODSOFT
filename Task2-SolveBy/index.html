<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolveBy Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --blue-900: #0b2a5e;
      --blue-700: #1450c4;
      --blue-500: #2f7bf6;
      --blue-300: #8fb8ff;
      --blue-100: #eaf2ff;
      --white: #ffffff;
      --ink: #0e1c34;
      --muted: #5b6b8c;
      --good: #1fae6e;
      --bad: #e6483f;
      --warn: #f0a93b;
      --radius: 16px;
      --shadow: 0 10px 30px -10px rgba(20, 80, 196, .35);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--ink);
      background: linear-gradient(160deg, var(--blue-100) 0%, var(--white) 45%, var(--blue-100) 100%);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    h1,
    h2,
    h3,
    h4 {
      font-family: 'Sora', sans-serif;
      margin: 0;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .app {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .hidden {
      display: none !important;
    }

    /* ===== Top Nav ===== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, .85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(20, 80, 196, .1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.15rem;
      color: var(--blue-900);
    }

    .brand .logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--blue-500), var(--blue-900));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      box-shadow: var(--shadow);
    }

    .nav-links {
      display: none;
      gap: 6px;
      align-items: center;
    }

    .nav-links button {
      background: none;
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 600;
      color: var(--blue-900);
      font-size: .92rem;
    }

    .nav-links button.active {
      background: var(--blue-100);
      color: var(--blue-700);
    }

    .nav-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .icon-btn {
      background: none;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--blue-900);
    }

    .icon-btn:hover {
      background: var(--blue-100);
    }

    .avatar-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--blue-100);
      padding: 6px 12px 6px 6px;
      border-radius: 999px;
      font-weight: 600;
      font-size: .85rem;
      color: var(--blue-900);
    }

    .avatar-circle {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--blue-500), var(--blue-900));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .75rem;
      font-weight: 700;
    }

    @media(min-width:880px) {
      .nav-links {
        display: flex;
      }

      .topbar {
        padding: 14px 36px;
      }
    }

    /* mobile bottom nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 50;
      background: rgba(255, 255, 255, .95);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(20, 80, 196, .1);
      display: flex;
      justify-content: space-around;
      padding: 8px 4px 10px;
    }

    @media(min-width:880px) {
      .bottom-nav {
        display: none;
      }
    }

    .bottom-nav button {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--muted);
      font-size: .65rem;
      font-weight: 600;
      flex: 1;
      padding: 4px;
    }

    .bottom-nav button.active {
      color: var(--blue-700);
    }

    .bottom-nav svg {
      width: 20px;
      height: 20px;
    }

    main {
      flex: 1;
      padding: 20px 16px 90px;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
    }

    @media(min-width:880px) {
      main {
        padding: 36px 36px 60px;
      }
    }

    /* ===== generic components ===== */
    .card {
      background: #fff;
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 6px 20px -8px rgba(20, 80, 196, .15);
      border: 1px solid rgba(20, 80, 196, .06);
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 13px 22px;
      font-weight: 700;
      font-size: .95rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform .15s, box-shadow .15s;
    }

    .btn:active {
      transform: scale(.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--blue-500), var(--blue-700));
      color: #fff;
      box-shadow: var(--shadow);
    }

    .btn-primary:hover {
      box-shadow: 0 14px 34px -10px rgba(106, 163, 156, 0.747);
    }

    .btn-outline {
      background: #fff;
      color: var(--blue-700);
      border: 2px solid var(--blue-300);
    }

    .btn-outline:hover {
      border-color: var(--blue-700);
    }

    .btn-ghost {
      background: var(--blue-100);
      color: var(--blue-900);
    }

    .btn-block {
      width: 100%;
    }

    .btn-sm {
      padding: 8px 14px;
      font-size: .82rem;
      border-radius: 9px;
    }

    .input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 11px;
      border: 1.5px solid #d7e3fb;
      font-size: .95rem;
      font-family: inherit;
      background: #fbfdff;
      outline: none;
      color: var(--ink);
    }

    .input:focus {
      border-color: var(--blue-500);
      box-shadow: 0 0 0 3px rgba(47, 123, 246, .15);
    }

    label.field-label {
      font-size: .82rem;
      font-weight: 700;
      color: var(--blue-900);
      margin-bottom: 6px;
      display: block;
    }

    .field {
      margin-bottom: 16px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: .72rem;
      font-weight: 700;
      background: var(--blue-100);
      color: var(--blue-700);
    }

    .section-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--blue-900);
      margin-bottom: 4px;
    }

    .section-sub {
      color: var(--muted);
      font-size: .92rem;
      margin-bottom: 18px;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid-2 {
      grid-template-columns: 1fr;
    }

    .grid-3 {
      grid-template-columns: 1fr;
    }

    @media(min-width:640px) {
      .grid-2 {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media(min-width:880px) {
      .grid-3 {
        grid-template-columns: 1fr 1fr 1fr;
      }
    }

    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--blue-900);
      color: #fff;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: .88rem;
      font-weight: 600;
      box-shadow: 0 10px 30px -8px rgba(0, 0, 0, .3);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s, bottom .25s;
    }

    .toast.show {
      opacity: 1;
      bottom: 100px;
    }

    @media(min-width:880px) {
      .toast {
        bottom: 30px;
      }

      .toast.show {
        bottom: 40px;
      }
    }

    /* ===== Home ===== */
    .hero {
      border-radius: 24px;
      padding: 42px 26px;
      color: #fff;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, var(--blue-900) 0%, var(--blue-700) 55%, var(--blue-500) 100%);
      margin-bottom: 24px;
    }

    .hero::before {
      content: '';
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, .18), transparent 70%);
      top: -100px;
      right: -80px;
    }

    .hero h1 {
      font-size: 1.9rem;
      line-height: 1.2;
      margin-bottom: 10px;
    }

    .hero p {
      color: rgba(255, 255, 255, .85);
      margin-bottom: 22px;
      max-width: 480px;
      font-size: .97rem;
    }

    .hero .stats {
      display: flex;
      gap: 22px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .hero .stat b {
      font-size: 1.4rem;
      display: block;
    }

    .hero .stat span {
      font-size: .75rem;
      color: rgba(255, 255, 255, .7);
    }

    @media(min-width:880px) {
      .hero {
        padding: 60px 50px;
      }

      .hero h1 {
        font-size: 2.6rem;
      }
    }

    .feature-row {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 8px;
    }

    .feature-chip {
      flex: 0 0 auto;
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      min-width: 150px;
      border: 1px solid rgba(20, 80, 196, .08);
      box-shadow: 0 6px 18px -10px rgba(20, 80, 196, .2);
    }

    .feature-chip .ic {
      font-size: 1.4rem;
      margin-bottom: 8px;
    }

    .feature-chip b {
      display: block;
      font-size: .88rem;
      color: var(--blue-900);
    }

    .feature-chip span {
      font-size: .75rem;
      color: var(--muted);
    }

    /* ===== Auth ===== */
    .auth-wrap {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 20px;
    }

    .auth-card {
      max-width: 420px;
      width: 100%;
    }

    .auth-card .logo-big {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, var(--blue-500), var(--blue-900));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 1.4rem;
      box-shadow: var(--shadow);
    }

    .auth-card h2 {
      text-align: center;
      font-size: 1.45rem;
      color: var(--blue-900);
      margin-bottom: 4px;
    }

    .auth-card .sub {
      text-align: center;
      color: var(--muted);
      font-size: .88rem;
      margin-bottom: 24px;
    }

    .switch-line {
      text-align: center;
      margin-top: 16px;
      font-size: .88rem;
      color: var(--muted);
    }

    .switch-line button {
      background: none;
      border: none;
      color: var(--blue-700);
      font-weight: 700;
    }

    .err-msg {
      background: #fdecea;
      color: #a3271f;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: .82rem;
      margin-bottom: 14px;
    }

    /* ===== Dashboard ===== */
    .dash-hero {
      border-radius: 20px;
      padding: 26px;
      margin-bottom: 20px;
      color: #fff;
      background: linear-gradient(120deg, var(--blue-700), var(--blue-500));
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .dash-hero h2 {
      font-size: 1.3rem;
    }

    .dash-hero p {
      opacity: .85;
      font-size: .85rem;
      margin-top: 4px;
    }

    .stat-card {
      padding: 18px;
      border-radius: 16px;
      background: #fff;
      text-align: left;
    }

    .stat-card .num {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--blue-900);
    }

    .stat-card .lbl {
      font-size: .78rem;
      color: var(--muted);
      font-weight: 600;
      margin-top: 2px;
    }

    .quiz-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid #eef2fb;
    }

    .quiz-list-item:last-child {
      border-bottom: none;
    }

    .quiz-list-item .meta b {
      display: block;
      font-size: .92rem;
      color: var(--blue-900);
    }

    .quiz-list-item .meta span {
      font-size: .75rem;
      color: var(--muted);
    }

    /* ===== Categories ===== */
    .search-row {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .search-row .input {
      flex: 1;
      min-width: 160px;
    }

    .filter-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-row select {
      padding: 11px 12px;
      border-radius: 11px;
      border: 1.5px solid #d7e3fb;
      background: #fbfdff;
      font-family: inherit;
      font-size: .88rem;
      color: var(--ink);
    }

    .cat-card {
      border-radius: 16px;
      padding: 20px;
      background: #fff;
      border: 1px solid rgba(20, 80, 196, .08);
      box-shadow: 0 6px 18px -10px rgba(20, 80, 196, .15);
      cursor: pointer;
      transition: transform .15s;
    }

    .cat-card:hover {
      transform: translateY(-3px);
    }

    .cat-card .ic {
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    .cat-card h3 {
      font-size: 1rem;
      color: var(--blue-900);
      margin-bottom: 4px;
    }

    .cat-card .diff-tags {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .diff-tag {
      font-size: .68rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
    }

    .diff-tag.easy {
      background: #e7f9ef;
      color: var(--good);
    }

    .diff-tag.medium {
      background: #fef3e0;
      color: var(--warn);
    }

    .diff-tag.hard {
      background: #fdecea;
      color: var(--bad);
    }

    /* ===== Quiz page ===== */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .timer-ring {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: .9rem;
      color: var(--blue-700);
      background: conic-gradient(var(--blue-500) calc(var(--p, 100)*1%), #e6eefc 0);
      position: relative;
    }

    .timer-ring::before {
      content: '';
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #fff;
    }

    .timer-ring span {
      position: relative;
      z-index: 1;
    }

    .progress-track {
      height: 8px;
      background: #e6eefc;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 22px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--blue-500), var(--blue-700));
      border-radius: 99px;
      transition: width .3s;
    }

    .q-counter {
      font-size: .78rem;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .q-text {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--blue-900);
      margin-bottom: 22px;
      line-height: 1.4;
    }

    .opt-btn {
      width: 100%;
      text-align: left;
      padding: 15px 16px;
      border-radius: 13px;
      border: 1.6px solid #e2eaf9;
      background: #fff;
      margin-bottom: 12px;
      font-size: .92rem;
      font-weight: 600;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all .15s;
    }

    .opt-btn:hover {
      border-color: var(--blue-500);
      background: var(--blue-100);
    }

    .opt-btn .opt-letter {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--blue-100);
      color: var(--blue-700);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .75rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    .opt-btn.selected {
      border-color: var(--blue-500);
      background: var(--blue-100);
    }

    .opt-btn.correct {
      border-color: var(--good);
      background: #e7f9ef;
    }

    .opt-btn.correct .opt-letter {
      background: var(--good);
      color: #fff;
    }

    .opt-btn.wrong {
      border-color: var(--bad);
      background: #fdecea;
    }

    .opt-btn.wrong .opt-letter {
      background: var(--bad);
      color: #fff;
    }

    .opt-btn:disabled {
      cursor: default;
    }

    .quiz-nav {
      display: flex;
      justify-content: space-between;
      margin-top: 24px;
      gap: 12px;
    }

    .explain-box {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--blue-100);
      font-size: .85rem;
      color: var(--blue-900);
      line-height: 1.5;
    }

    /* ===== Results ===== */
    .results-hero {
      text-align: center;
      padding: 30px 16px;
    }

    .score-ring {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      margin: 0 auto 18px;
      position: relative;
      background: conic-gradient(var(--blue-500) calc(var(--pct, 0)*1%), #e6eefc 0);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .score-ring::before {
      content: '';
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #fff;
    }

    .score-ring .val {
      position: relative;
      z-index: 1;
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--blue-900);
    }

    .score-ring .val small {
      display: block;
      font-size: .7rem;
      color: var(--muted);
      font-weight: 600;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--blue-500), var(--blue-900));
      color: #fff;
      font-weight: 800;
      font-size: .95rem;
      box-shadow: var(--shadow);
      margin-bottom: 6px;
    }

    .review-item {
      padding: 14px 0;
      border-bottom: 1px solid #eef2fb;
    }

    .review-item:last-child {
      border-bottom: none;
    }

    .review-item .rq {
      font-weight: 700;
      font-size: .9rem;
      color: var(--blue-900);
      margin-bottom: 6px;
    }

    .review-item .ra {
      font-size: .82rem;
      margin-bottom: 3px;
    }

    .review-item .ra.correct {
      color: var(--good);
      font-weight: 700;
    }

    .review-item .ra.wrong {
      color: var(--bad);
      font-weight: 700;
    }

    .review-item .rexp {
      font-size: .78rem;
      color: var(--muted);
      margin-top: 6px;
    }

    /* ===== Leaderboard ===== */
    .lb-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 14px;
      border-radius: 13px;
      margin-bottom: 8px;
      background: #fff;
      border: 1px solid rgba(20, 80, 196, .06);
    }

    .lb-rank {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--blue-100);
      color: var(--blue-700);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: .8rem;
      flex-shrink: 0;
    }

    .lb-row.top1 .lb-rank {
      background: linear-gradient(135deg, #ffd25c, #f0a93b);
      color: #fff;
    }

    .lb-row.top2 .lb-rank {
      background: linear-gradient(135deg, #c9d4e8, #9fb0cf);
      color: #fff;
    }

    .lb-row.top3 .lb-rank {
      background: linear-gradient(135deg, #e0ab84, #c07f50);
      color: #fff;
    }

    .lb-name {
      flex: 1;
      font-weight: 700;
      font-size: .9rem;
      color: var(--blue-900);
    }

    .lb-name small {
      display: block;
      font-weight: 500;
      color: var(--muted);
      font-size: .72rem;
    }

    .lb-score {
      font-weight: 800;
      color: var(--blue-700);
    }

    /* ===== Create Quiz ===== */
    .q-builder-item {
      border: 1.5px dashed #cfe0ff;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      position: relative;
    }

    .q-builder-item .rm-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #fdecea;
      color: var(--bad);
      border: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-weight: 800;
    }

    .opt-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .opt-input-row input[type=radio] {
      width: 18px;
      height: 18px;
      accent-color: var(--blue-700);
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--muted);
    }

    .empty-state .ic {
      font-size: 2.4rem;
      margin-bottom: 10px;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 4px solid var(--blue-100);
      border-top-color: var(--blue-700);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 30px auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-wrap {
      text-align: center;
      padding: 40px;
      color: var(--muted);
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .hero {
        padding: 20px;
        text-align: center;
      }

      .btn {
        width: 100%;
      }

      .search-row,
      .filter-row {
        flex-direction: column;
      }

      .topbar {
        padding: 12px;
      }

      .quiz-header {
        flex-direction: column;
        gap: 12px;
      }
    }
  </style>
</head>
